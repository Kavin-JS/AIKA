name: ai-knowledge-assistant

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_knowledge_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      # NOTE: recent minio/minio images removed curl/wget from the image,
      # so this healthcheck currently fails and MinIO will show
      # "unhealthy" in `docker compose ps`. That's known and harmless in
      # v0.1 since nothing gates on it (see `backend.depends_on` below).
      # Fixed properly in v0.3 when MinIO is actually consumed.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_knowledge_assistant}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: python:3.12-slim doesn't reliably ship curl
      # either (see the MinIO healthcheck above — same mistake, not
      # repeating it here). Python is the one thing guaranteed present
      # in this exact image. Targets /health/live, not /health/ready,
      # deliberately: this check exists to answer "is the uvicorn
      # worker actually serving requests," not "is Postgres reachable" —
      # conflating the two would make an unrelated DB blip look like a
      # dead application process. An uncaught exception from urlopen()
      # (connection refused, non-2xx, timeout) exits non-zero, which is
      # exactly what a failing healthcheck needs — no explicit
      # sys.exit() required.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Redis and MinIO run in this stack because they're part of the
    # planned development environment, but the backend doesn't use
    # either yet (no worker, no ingestion pipeline in v0.1) — so it
    # shouldn't have its startup gated on their health. A service should
    # only depend on infrastructure it actually consumes. Their
    # dependency (with a correct healthcheck) is added in v0.3 when the
    # worker and ingestion pipeline genuinely need them.

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        # Now meaningful: before this healthcheck existed, "backend
        # started" and "backend is actually serving requests" were
        # indistinguishable to Compose (see the reloader-survives-a-
        # crashed-worker issue this fixes). Waiting on service_healthy
        # means the frontend container doesn't start racing against a
        # backend that's up but non-functional.
        condition: service_healthy

  # worker is intentionally not defined yet: v0.1 ships no processing
  # jobs to run, so an idle worker process would just be scope creep.
  # It's added in v0.3 (Document Lifecycle) alongside the job queue it
  # actually consumes from.

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
