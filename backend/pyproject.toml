[project]
name = "ai-knowledge-assistant-backend"
version = "0.1.0"
description = "Backend for the AI Knowledge Assistant (v0.1 Foundation)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...)-as-a-default-argument is the documented,
# idiomatic pattern (not the "mutable default" footgun this rule targets).
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
